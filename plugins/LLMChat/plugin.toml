# LLMChat Plugin Metadata

[plugin]
name = "LLMChat"
version = "0.1.0"
author = "BonitoBook Contributors"
description = "Interactive LLM chat notebook with streaming responses, tool use, and file editing"

[features]
streaming = true
tool_use = true
file_editor = true
code_sanitizer = true

[dependencies]
# Julia packages required by this plugin
required = ["Bonito", "BonitoBook", "Observables", "JSON3", "HTTP"]

[template]
# Template configuration
has_template = true
copy_data_by_default = false

# Files to include when copying template
include = ["style.jl", "README.md"]

# Variables that can be used in templates (for future expansion)
# Users can provide these when calling create_book_from_plugin
variables = ["BOOK_TITLE", "AUTHOR", "DEFAULT_MODEL"]
